<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1a24">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Tic Tac Toe XL</title>
<style>
:root{--bg1:#0b1a24;--bg2:#1a2f3a;--panel:#13252e;--cell:#1e3642;--tx:#e3f3f8;--mu:#7b9ba8;--x:#7cc4ff;--o:#ff9b7a;--win:#7fe0c8;--w:300px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;overflow:hidden;touch-action:manipulation;overscroll-behavior:none}
body{background:linear-gradient(145deg,var(--bg1),var(--bg2));color:var(--tx);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:8px;height:100vh;height:100dvh;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 8px) calc(env(safe-area-inset-bottom,0px) + 8px) calc(env(safe-area-inset-left,0px) + 8px)}
#hud,#bar{width:var(--w);display:flex;gap:8px;justify-content:space-between;align-items:center}
.pill{flex:1;background:var(--panel);padding:8px 10px;border-radius:18px;font-weight:700;font-size:15px;text-align:center;white-space:nowrap;border:2px solid transparent;transition:border-color .15s}
.pill.act{border-color:var(--win)}
.pill b{margin-left:4px}
i{font-style:normal;font-weight:800}i.X{color:var(--x)}i.O{color:var(--o)}
#turn{min-height:26px;font-size:18px;font-weight:700;color:#b8dde9;text-align:center}
#stage{flex:1;min-height:0;width:100%;display:flex;align-items:center;justify-content:center}
#bd{display:grid;grid-template-columns:repeat(3,1fr)}
.cell{position:relative;min-width:0;min-height:0;width:100%;height:100%;overflow:visible;background:var(--cell);border:none;border-radius:16%;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 5px 0 #0b1a22;padding:0}
.cell:active{transform:translateY(3px);box-shadow:0 2px 0 #0b1a22}
.cell.X,.cell.O{cursor:default}
.cell svg{position:absolute;left:14%;top:14%;width:72%;height:72%;fill:none;stroke-width:11;stroke-linecap:round}
.cell.X svg{stroke:var(--x);filter:drop-shadow(0 0 6px var(--x))}
.cell.O svg{stroke:var(--o);filter:drop-shadow(0 0 6px var(--o))}
.cell svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:dr .32s ease-out forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.cell.win{background:#2c5a58;box-shadow:0 0 18px var(--win),0 5px 0 #17322f;animation:pl .6s ease-in-out 3}
@keyframes pl{50%{transform:scale(1.06)}}
.btn{font:inherit;font-weight:700;font-size:15px;color:var(--tx);background:#2e5a69;border:1px solid #5b93a3;border-radius:14px;padding:10px 14px;cursor:pointer;flex:1;box-shadow:0 4px 0 #0d1e26}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #0d1e26}
.btn.sm{flex:0 0 auto;padding:10px 14px}
#menu{position:fixed;inset:0;background:rgba(6,14,19,.94);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;z-index:20}
.panel{width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;text-align:center;margin:auto}
.panel h1{font-size:30px;margin-bottom:4px}
.panel h2{font-size:13px;font-weight:700;color:var(--mu);text-align:left;margin-top:6px}
.panel p{color:var(--mu);font-size:14px}
.row{display:flex;gap:8px}
.seg{font:inherit;font-weight:700;font-size:15px;flex:1;color:var(--tx);background:var(--panel);border:2px solid #2f4d59;border-radius:14px;padding:12px 6px;cursor:pointer}
.seg.on{border-color:var(--win);color:var(--win);background:#1b3d3d}
.btn.go{background:#ff6f61;border-color:#ff6f61;color:#fff;font-size:20px;padding:14px;margin-top:6px;box-shadow:0 5px 0 #a13d33}
#cf{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (max-height:520px){#turn{min-height:0;font-size:15px}.pill{padding:5px 8px}.btn.sm,.btn{padding:6px 12px}}
@media (prefers-reduced-motion:reduce){.cell svg *{animation:none;stroke-dashoffset:0}.cell.win{animation:none}}
</style>
</head>
<body>
<div id="hud"><div class="pill" id="p1"></div><div class="pill" id="pd"></div><div class="pill" id="p2"></div></div>
<div id="turn"></div>
<div id="stage"><div id="bd"></div></div>
<div id="bar"><button class="btn" id="bmenu">☰ Menu</button><button class="btn" id="bnext">↻ Next round</button><button class="btn sm" id="bf" title="Full screen">⛶</button><button class="btn sm" id="bs">🔊</button></div>
<div id="menu"></div>
<canvas id="cf"></canvas>
<script>
(()=>{
const $=id=>document.getElementById(id),bd=$('bd'),rnd=k=>Math.floor(Math.random()*k);
const P='tttXL.',get=(k,d)=>{try{return localStorage.getItem(P+k)||d}catch(e){return d}},set=(k,v)=>{try{localStorage.setItem(P+k,v)}catch(e){}};
let n=+get('n',3),mode=get('mode','ai'),diff=get('diff','hard'),sound=get('snd','1')=='1';
const KK={3:3,4:4,5:4},DEP={3:9,4:4,5:3},D=[[1,0],[0,1],[1,1],[1,-1]];
let b=[],turn='X',starter='X',active=false,over=false,sc={X:0,O:0,D:0},streak=0,tm=null;
const XS='<svg viewBox="0 0 100 100"><path pathLength="1" d="M24 24L76 76M76 24L24 76"/></svg>',OS='<svg viewBox="0 0 100 100"><circle pathLength="1" cx="50" cy="50" r="28"/></svg>';
const names=()=>mode=='ai'?{X:'You',O:'AI'}:{X:'P1',O:'P2'};
 
/* sound + haptics */
let ac;
function beep(f,d,ty,v,f2){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d)}catch(e){}}
const buzz=v=>{try{navigator.vibrate&&navigator.vibrate(v)}catch(e){}};
 
/* confetti */
const cf=$('cf'),cc=cf.getContext('2d');let ps=[],raf=0;
function confetti(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const w=cf.width=innerWidth,h=cf.height=innerHeight;for(let i=0;i<140;i++)ps.push({x:w/2,y:h*.55,vx:(Math.random()-.5)*14,vy:-Math.random()*16-4,r:Math.random()*6.28,vr:(Math.random()-.5)*.4,c:'hsl('+rnd(360)+',85%,62%)',s:6+Math.random()*6});if(!raf)raf=requestAnimationFrame(cfLoop)}
function cfLoop(){cc.clearRect(0,0,cf.width,cf.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;cc.save();cc.translate(p.x,p.y);cc.rotate(p.r);cc.fillStyle=p.c;cc.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);cc.restore()});ps=ps.filter(p=>p.y<cf.height+20);raf=ps.length?requestAnimationFrame(cfLoop):0;if(!raf)cc.clearRect(0,0,cf.width,cf.height)}
 
/* rules */
function win(b){
 const K=KK[n];
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const m=b[y*n+x];if(!m)continue;
  for(const[dx,dy]of D){const line=[y*n+x];for(let k=1;k<K;k++){const xx=x+dx*k,yy=y+dy*k;if(xx<0||yy<0||xx>=n||yy>=n||b[yy*n+xx]!==m)break;line.push(yy*n+xx)}if(line.length==K)return{w:m,line}}}
 return b.every(Boolean)?{w:'D'}:null;
}
 
/* AI */
function cands(b){const e=[];for(let i=0;i<n*n;i++)if(!b[i])e.push(i);if(n==3)return e;
 const near=e.filter(i=>{const y=i/n|0,x=i%n;for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&xx>=0&&yy<n&&xx<n&&b[yy*n+xx])return true}return false});
 return near.length?near:[(n>>1)*n+(n>>1)]}
function ev(b){const K=KK[n];let s=0;
 for(let y=0;y<n;y++)for(let x=0;x<n;x++)for(const[dx,dy]of D){const ex=x+dx*(K-1),ey=y+dy*(K-1);if(ex<0||ey<0||ex>=n||ey>=n)continue;
  let o=0,q=0;for(let k=0;k<K;k++){const m=b[(y+dy*k)*n+x+dx*k];if(m=='O')o++;else if(m=='X')q++}
  if(o&&q)continue;if(o)s+=4**o;else if(q)s-=4**q}
 return s}
function ab(b,d,al,be,mx){
 const r=win(b);if(r){if(r.w=='O')return 1000+d;if(r.w=='X')return-1000-d;return 0}
 if(!d)return ev(b);
 let v=mx?-1e9:1e9;
 for(const i of cands(b)){b[i]=mx?'O':'X';const s=ab(b,d-1,al,be,!mx);b[i]='';
  if(mx){v=Math.max(v,s);al=Math.max(al,v)}else{v=Math.min(v,s);be=Math.min(be,v)}
  if(al>=be)break}
 return v}
function pick(){
 const emp=[];b.forEach((v,i)=>{if(!v)emp.push(i)});
 if(diff=='easy')return emp[rnd(emp.length)];
 if(diff=='medium'){
  for(const p of['O','X'])for(const i of emp){b[i]=p;const r=win(b);b[i]='';if(r&&r.w==p)return i}
  const c=cands(b);return c[rnd(c.length)]}
 if(n==3&&emp.length==9)return[0,2,4,6,8][rnd(5)];
 let best=-1e9,bm=[];
 for(const i of cands(b)){b[i]='O';const v=ab(b,DEP[n]-1,-1e9,1e9,false);b[i]='';if(v>best){best=v;bm=[i]}else if(v==best)bm.push(i)}
 return bm[rnd(bm.length)]}
 
/* round flow */
function fit(){const st=$('stage'),aw=st.clientWidth,ah=st.clientHeight,s=Math.floor(Math.min(aw,ah));
 bd.style.width=bd.style.height=s+'px';bd.style.gap=Math.max(4,s/(n*15))+'px';
 document.documentElement.style.setProperty('--w',Math.max(s,Math.min(aw,300))+'px')}
function build(){bd.style.gridTemplateColumns=bd.style.gridTemplateRows='repeat('+n+',minmax(0,1fr))';bd.innerHTML='';for(let i=0;i<n*n;i++){const c=document.createElement('button');c.className='cell';c.setAttribute('aria-label','Cell '+(i+1));bd.appendChild(c)}}
function ui(msg){const N=names();
 $('p1').innerHTML='<i class="X">✕</i> '+N.X+'<b>'+sc.X+'</b>';$('p2').innerHTML='<i class="O">◯</i> '+N.O+'<b>'+sc.O+'</b>';$('pd').innerHTML='Draw<b>'+sc.D+'</b>';
 $('p1').classList.toggle('act',active&&turn=='X');$('p2').classList.toggle('act',active&&turn=='O');
 $('turn').textContent=msg||(active?(mode=='ai'?(turn=='X'?'Your turn':'AI is thinking…'):N[turn]+"'s turn"):'')}
function newRound(flip){
 clearTimeout(tm);if(flip)starter=starter=='X'?'O':'X';
 fit();build();b=Array(n*n).fill('');turn=starter;active=true;over=false;ui();
 if(mode=='ai'&&turn=='O')tm=setTimeout(aiMove,450)}
function place(i){
 b[i]=turn;const c=bd.children[i];c.className='cell '+turn;c.innerHTML=turn=='X'?XS:OS;
 beep(turn=='X'?520:400,.12,'triangle',.08,turn=='X'?680:300);buzz(10);
 const r=win(b);if(r)return end(r);
 turn=turn=='X'?'O':'X';ui();
 if(mode=='ai'&&turn=='O')tm=setTimeout(aiMove,350+rnd(250))}
function aiMove(){if(active&&turn=='O')place(pick())}
function end(r){
 active=false;over=true;const N=names();let msg;
 if(r.w=='D'){sc.D++;streak=0;msg='Draw — tap for next round';beep(300,.3,'sine',.07,250)}
 else{sc[r.w]++;r.line.forEach(i=>bd.children[i].classList.add('win'));
  if(mode=='ai'){
   if(r.w=='X'){streak++;msg=(streak>1?'You win! 🔥 '+streak+' in a row':'You win!')+' Tap to go again';confetti();buzz([40,30,80]);[520,660,780,1040].forEach((f,k)=>setTimeout(()=>beep(f,.18,'triangle',.08),k*110))}
   else{streak=0;msg='AI wins — tap for a rematch';buzz([80,40,120]);beep(300,.5,'sawtooth',.07,60)}
  }else{msg=N[r.w]+' wins! Tap to continue';confetti();buzz([40,30,80]);[520,660,780,1040].forEach((f,k)=>setTimeout(()=>beep(f,.18,'triangle',.08),k*110))}}
 ui(msg)}
bd.addEventListener('click',e=>{
 if(over){newRound(true);return}
 if(!active||(mode=='ai'&&turn=='O'))return;
 const c=e.target.closest('.cell');if(!c)return;const i=[...bd.children].indexOf(c);
 if(!b[i])place(i)});
 
/* menu */
function menu(){
 active=false;clearTimeout(tm);
 const seg=(k,v,l,cur)=>'<button class="seg'+(cur==v?' on':'')+'" data-k="'+k+'" data-v="'+v+'">'+l+'</button>';
 $('menu').innerHTML='<div class="panel"><h1>Tic Tac Toe XL</h1><h2>Opponent</h2><div class="row">'+seg('mode','ai','🤖 vs AI',mode)+seg('mode','2p','👥 2 players',mode)+'</div>'
 +(mode=='ai'?'<h2>AI level</h2><div class="row">'+seg('diff','easy','Easy',diff)+seg('diff','medium','Medium',diff)+seg('diff','hard','Unbeatable',diff)+'</div>':'')
 +'<h2>Board</h2><div class="row">'+seg('n',3,'3×3',n)+seg('n',4,'4×4',n)+seg('n',5,'5×5',n)+'</div><p>Get '+KK[n]+' in a row to win.</p><button class="btn go" data-a="start">Play</button></div>';
 $('menu').style.display='flex'}
$('menu').addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;
 if(t.dataset.k){const k=t.dataset.k,v=t.dataset.v;if(k=='n')n=+v;else if(k=='mode')mode=v;else diff=v;set(k,v);menu()}
 else if(t.dataset.a=='start'){sc={X:0,O:0,D:0};streak=0;starter='X';$('menu').style.display='none';if(matchMedia('(pointer:coarse)').matches)goFS(true);newRound(false)}});
$('bmenu').onclick=menu;$('bnext').onclick=()=>newRound(!active&&over);
 
/* full screen + sound toggle */
const de=document.documentElement,rf=de.requestFullscreen||de.webkitRequestFullscreen,xf=document.exitFullscreen||document.webkitExitFullscreen,inFS=()=>document.fullscreenElement||document.webkitFullscreenElement;
function goFS(only){try{if(!rf)return;if(inFS()){if(!only)xf.call(document)}else{const r=rf.call(de);r&&r.catch&&r.catch(()=>{})}}catch(e){}}
if(!rf)$('bf').style.display='none';$('bf').onclick=()=>goFS();
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>setTimeout(fit,100)));
const bs=$('bs');bs.textContent=sound?'🔊':'🔇';bs.onclick=()=>{sound=!sound;set('snd',sound?'1':'0');bs.textContent=sound?'🔊':'🔇'};
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,200));
 
fit();build();b=Array(n*n).fill('');ui();menu();
})();
</script>
</body>
</html>
