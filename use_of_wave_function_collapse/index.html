<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wandering Worlds</title>
<style>
:root{--panel:rgba(18,20,34,.86);--line:rgba(255,255,255,.16);--text:#eef0f8;--mute:#a3a9c0;--acc:#ffd166;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--panel:rgba(255,255,255,.9);--line:rgba(0,0,0,.14);--text:#1c1e2b;--mute:#5d6379;--acc:#c77900}}
:root[data-theme="light"]{--panel:rgba(255,255,255,.9);--line:rgba(0,0,0,.14);--text:#1c1e2b;--mute:#5d6379;--acc:#c77900}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#1c66cf;font:14px/1.4 "Trebuchet MS",Verdana,sans-serif;color:var(--text)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
#tog{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:5}
#panel{position:fixed;right:12px;top:calc(56px + env(safe-area-inset-top,0px));width:270px;max-height:calc(100% - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(10px);z-index:4}
#panel[hidden]{display:none}
h2{font-size:16px;margin:0 0 2px}
p.s{margin:0 0 10px;color:var(--mute);font-size:12px}
label{display:grid;gap:3px;margin:9px 0;color:var(--mute);font-size:12px}
label b{color:var(--text)}
.chk{display:flex;gap:8px;align-items:center;margin:8px 0;color:var(--text)}
select,button{font:inherit;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#241800;border-color:var(--acc);font-weight:700}
input[type=range]{width:100%;accent-color:var(--acc)}
.row{display:flex;gap:8px;margin-top:10px}
#hud{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);font-size:13px;transition:opacity 1.5s;pointer-events:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud"><b>Wandering Worlds</b> · terrain grown by Wave Function Collapse · drag to steer, tap for confetti</div>
<button id="tog" aria-expanded="true">Controls</button>
<div id="panel">
  <h2>Wandering Worlds</h2><p class="s">An endless cartoon planet that grows as you travel.</p>
  <label>World<select id="theme"></select></label>
  <label>Travel speed: <b id="spV"></b><input id="sp" type="range" min="0" max="300" value="70"></label>
  <label>Zoom: <b id="zV"></b><input id="zm" type="range" min="0.5" max="1.6" step="0.05" value="1"></label>
  <label>Scenery: <b id="dnV"></b><input id="dn" type="range" min="0" max="2" step="0.1" value="1"></label>
  <label>Clouds: <b id="clV"></b><input id="cl" type="range" min="0" max="3" step="0.05" value="0.3"></label>
  <label>Time of day: <b id="tmV"></b><input id="tm" type="range" min="0" max="1" step="0.01" value="0.5"></label>
  <div class="chk"><input type="checkbox" id="cyc" checked><span>Day / night cycle</span></div>
  <div class="chk"><input type="checkbox" id="auto" checked><span>Auto-wander</span></div>
  <div class="row"><button class="pri" id="new">New world</button><button id="save">Save PNG</button></div>
  <p class="s" style="margin-top:10px" id="stat"></p>
</div>

<script>
const $=id=>document.getElementById(id), cv=$("cv"), ctx=cv.getContext("2d");
const VS=64, CN=12, NV=CN+1, CW=VS*CN, R=.75, SZ=Math.round(CW*R), WARP=.16;
const THEMES={
 isles:{name:"Sunny Isles",pal:["#1c66cf","#46bde8","#f6e3a1","#83dd5b","#3c9f4c","#f4f8fc"],line:"#17402f",
  objs:{2:["🌴","🌴","🐚","⛱️","🦀"],3:["🌳","🌳","🌷","🏡","🌻","🌼"],4:["🌲","🌲","🌲","🌲","⛺","🍄"],5:["🏔️","⛰️","🚩","🌨️"]},
  fly:["🕊️","🦋","🦜"],sea:["⛵","🐳","🐬","🦈","🐙","🚤"],walk:["🐑","🐄","🦌","🐇","🐕","🦆"],pop:["🎈","⭐","🌈","🎉","🍀"]},
 candy:{name:"Candy Land",pal:["#ff86c8","#ffb8e0","#fff0c2","#a5f0cc","#c9a4ff","#ffffff"],line:"#7b3a86",
  objs:{2:["🍬","🧁","🍭"],3:["🍩","🍰","🍦","🍓","🎂"],4:["🍄","🍡","🎄","🍒"],5:["🍨","🎪","🏰"]},
  fly:["🦄","🦋","🕊️"],sea:["🐙","🦑","🐡","🛟","🐠"],walk:["🐰","🐻","🐱","🐹","🐷"],pop:["🍭","🍬","💖","✨","🍩"]},
 alien:{name:"Alien Moon",pal:["#150b36","#3b1f86","#ffb36b","#37e6a0","#0fae8a","#fff2a8"],line:"#0a0522",
  objs:{2:["💎","🪨","🔮"],3:["👽","🍄","🛸","🌵"],4:["🌵","🪸","🍄","🧿"],5:["🌋","🗿","🪐"]},
  fly:["🛸","☄️","🦇"],sea:["👾","🐙","🦑","🐋"],walk:["👽","🦎","🐌","🦂"],pop:["✨","💫","🪐","⭐","🌟"]}};
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
let TH,seed,cfg={theme:"isles",sp:70,z:1,dn:1,cl:.3,tm:.5,cyc:true,auto:true};
const chunks=new Map(), GV=new Map();
const key=(a,b)=>a+","+b, clamp=(v,a,b)=>v<a?a:v>b?b:v;
function hash(a,b,c){let h=(a*374761393+b*668265263+c*2147483647)|0;h=Math.imul(h^h>>>13,1274126177);return(h^h>>>16)>>>0}
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

// ---------- Wave Function Collapse: terrain heights on a vertex grid, neighbours differ by at most 1 ----------
const LW=[.7,1.3,1,1.5,1.1,.55];
const target=(gx,gy)=>2.6+1.7*Math.sin(gx*.11+seed%7)*Math.cos(gy*.09+seed%5)+1.2*Math.sin(gx*.05+gy*.07+seed%11)+.7*Math.sin(gx*.23-gy*.19);
const pc=m=>(m&1)+(m>>1&1)+(m>>2&1)+(m>>3&1)+(m>>4&1)+(m>>5&1);
const NBS=Array.from({length:NV*NV},(_,c)=>{const x=c%NV,y=c/NV|0,r=[];if(x>0)r.push(c-1);if(x<CN)r.push(c+1);if(y>0)r.push(c-NV);if(y<CN)r.push(c+NV);return r});
function prop(d,q){while(q.length){const c=q.pop(),m=d[c],a=(m|m<<1|m>>1)&63;for(const n of NBS[c]){const nm=d[n]&a;if(nm!==d[n]){if(!nm)return false;d[n]=nm;q.push(n)}}}return true}
function solve(fixed,rng,cx,cy){
  let dom=new Uint8Array(NV*NV).fill(63); for(const [i,l] of fixed) dom[i]=1<<l;
  if(!prop(dom,[...dom.keys()])) return null;
  const st=[]; let bt=0,ok=true;
  for(;;){
    if(!ok){ let fx=false;
      while(st.length){ if(++bt>400) return null; const s=st.pop(); dom=s.dom; dom[s.c]&=~(1<<s.v); if(dom[s.c]&&prop(dom,[s.c])){fx=true;break} }
      if(!fx) return null; ok=true; continue; }
    let best=-1,be=9;
    for(let c=0;c<dom.length;c++){const n=pc(dom[c]); if(n>1){const e=n+rng()*.6; if(e<be){be=e;best=c}}}
    if(best<0) return dom;
    const tg=target(cx*CN+best%NV,cy*CN+(best/NV|0));
    let avg=0,an=0; for(const n of NBS[best]) if(pc(dom[n])===1){avg+=31-Math.clz32(dom[n]);an++}
    const ws=[]; let tot=0;
    for(let v=0;v<6;v++){ if(!(dom[best]>>v&1)){ws.push(0);continue} let w=LW[v]*Math.exp(-.8*Math.abs(v-tg)); if(an) w*=Math.exp(-.7*Math.abs(v-avg/an)); ws.push(w); tot+=w; }
    let r=rng()*tot,pick=0; for(let v=0;v<6;v++){ if(!ws[v]) continue; pick=v; r-=ws[v]; if(r<=0) break; }
    st.push({dom:dom.slice(),c:best,v:pick}); dom[best]=1<<pick; ok=prop(dom,[best]);
  }
}
function genChunk(cx,cy){
  const rng=mulberry(hash(seed,cx,cy)), fixed=[];
  for(let j=0;j<NV;j++)for(let i=0;i<NV;i++){const g=GV.get(key(cx*CN+i,cy*CN+j)); if(g!==undefined) fixed.push([j*NV+i,g]);}
  let dom=null; for(let a=0;a<4&&!dom;a++) dom=solve(fixed,rng,cx,cy);
  if(!dom) dom=solve([],rng,cx,cy); if(!dom) dom=new Uint8Array(NV*NV).fill(8);
  const V=new Uint8Array(NV*NV);
  for(let j=0;j<NV;j++)for(let i=0;i<NV;i++){const k=key(cx*CN+i,cy*CN+j), g=GV.get(k); V[j*NV+i]=g!==undefined?g:31-Math.clz32(dom[j*NV+i]); if(g===undefined) GV.set(k,V[j*NV+i]);}
  return {cx,cy,V,cv:null,objs:null,born:0};
}
function H(V,x,y,wx,wy){
  const fx=x/VS,fy=y/VS; let i=fx|0,j=fy|0; if(i>=CN)i=CN-1; if(j>=CN)j=CN-1;
  let tx=fx-i,ty=fy-j; tx=tx*tx*(3-2*tx); ty=ty*ty*(3-2*ty);
  const a=V[j*NV+i],b=V[j*NV+i+1],c=V[(j+1)*NV+i],d=V[(j+1)*NV+i+1];
  return (a+(b-a)*tx)*(1-ty)+(c+(d-c)*tx)*ty+WARP*(Math.sin(wx*.045+wy*.03)+Math.sin(wx*.021-wy*.05));
}
function hAt(x,y){const cx=Math.floor(x/CW),cy=Math.floor(y/CW),ch=chunks.get(key(cx,cy)); return ch?H(ch.V,x-cx*CW,y-cy*CW,x,y):null}

// ---------- cartoon rendering of a chunk (toon bands, outlines, foam, shallow water) ----------
function renderChunk(ch,now){
  const c=document.createElement("canvas"); c.width=c.height=SZ; const g=c.getContext("2d");
  const img=g.createImageData(SZ,SZ), buf=new Uint32Array(img.data.buffer), P=TH.rgb, L=TH.lrgb, ox=ch.cx*CW, oy=ch.cy*CW;
  for(let py=0;py<SZ;py++)for(let px=0;px<SZ;px++){
    const x=(px+.5)/R,y=(py+.5)/R,h=H(ch.V,x,y,ox+x,oy+y); let r,gg,b,a;
    if(h<1.36){ [r,gg,b]=P[1]; a=clamp((h-.55)/.8,0,1)*190; }
    else if(h<1.5){ r=gg=b=255; a=245; }
    else { const k=Math.min(5,Math.floor(h+.5)), f=h+.5-k, sh=.88+.22*f, n=((px*7+py*13^px*py)&7)-3; [r,gg,b]=P[k]; r=r*sh+n; gg=gg*sh+n; b=b*sh+n; a=255;
      if(h<1.545||(k>=3&&f<.05)){ const m=h<1.545?1:.6; r=r+(L[0]-r)*m; gg=gg+(L[1]-gg)*m; b=b+(L[2]-b)*m; } }
    buf[py*SZ+px]=(a<<24)|(clamp(b,0,255)<<16)|(clamp(gg,0,255)<<8)|clamp(r,0,255);
  }
  g.putImageData(img,0,0); ch.cv=c; ch.born=now; makeObjs(ch);
}
const PROB={2:.16,3:.26,4:.6,5:.2}, SIZE={2:44,3:58,4:66,5:74};
function makeObjs(ch){
  const rng=mulberry(hash(seed,ch.cx,ch.cy)^777), objs=[], V=ch.V;
  for(let j=0;j<CN;j++)for(let i=0;i<CN;i++){
    const k=Math.round((V[j*NV+i]+V[j*NV+i+1]+V[(j+1)*NV+i]+V[(j+1)*NV+i+1])/4), list=TH.objs[k];
    if(!list||rng()>=PROB[k]*cfg.dn) continue;
    const x=(i+.15+.7*rng())*VS,y=(j+.15+.7*rng())*VS,h=H(V,x,y,ch.cx*CW+x,ch.cy*CW+y); if(h<1.9||Math.round(h)!==k) continue;
    objs.push({x:ch.cx*CW+x,y:ch.cy*CW+y,e:list[rng()*list.length|0],s:SIZE[k]*(.85+.3*rng()),ph:rng()*6.28});
  }
  ch.objs=objs;
}
const SPR=new Map();
function spr(e){let s=SPR.get(e); if(!s){s=document.createElement("canvas"); s.width=s.height=110; const g=s.getContext("2d"); g.font='84px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif'; g.textAlign="center"; g.textBaseline="middle"; g.fillText(e,55,60); SPR.set(e,s)} return s}
function waterPat(size,seedn,alpha){
  const c=document.createElement("canvas"); c.width=c.height=size; const g=c.getContext("2d"), r=mulberry(seedn); g.lineWidth=3; g.lineCap="round"; g.strokeStyle=`rgba(255,255,255,${alpha})`;
  for(let n=0;n<size/16;n++){const x=r()*size,y=r()*size; for(const ox of[-size,0,size])for(const oy of[-size,0,size]){g.beginPath();g.moveTo(x+ox,y+oy);g.quadraticCurveTo(x+ox+14,y+oy-9,x+ox+28,y+oy);g.quadraticCurveTo(x+ox+42,y+oy+9,x+ox+56,y+oy);g.stroke()}}
  return ctx.createPattern(c,"repeat");
}

// ---------- world state ----------
let W,H_,dpr,cam,vel,heading,last=0,drag=false,pat1,pat2,ents=[],pops=[],clouds=[],flies=[];
function setTheme(name){ cfg.theme=name; TH=THEMES[name]; TH.rgb=TH.pal.map(hex); TH.lrgb=hex(TH.line); document.body.style.background=TH.pal[0];
  for(const ch of chunks.values()){ch.cv=null;ch.objs=null} ents=[]; pat1=waterPat(200,3,.42); pat2=waterPat(320,9,.28); }
function newWorld(){ seed=(Math.random()*1e9|0); chunks.clear(); GV.clear(); ents=[]; cam={x:0,y:0}; vel={x:0,y:0}; heading=Math.random()*6.28;
  clouds=Array.from({length:12},()=>({x:Math.random(),y:Math.random(),s:.8+Math.random()*1.2,v:8+Math.random()*14}));
  flies=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),p:Math.random()*6.28,v:.3+Math.random()*.7})); }
function resize(){ dpr=Math.min(devicePixelRatio||1,2); W=innerWidth; H_=innerHeight; cv.width=W*dpr; cv.height=H_*dpr; }

function ensureChunks(now,z,budget){
  const mx=CW*.8, x0=Math.floor((cam.x-W/2/z-mx)/CW),x1=Math.floor((cam.x+W/2/z+mx)/CW),y0=Math.floor((cam.y-H_/2/z-mx)/CW),y1=Math.floor((cam.y+H_/2/z+mx)/CW), need=[];
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){const ch=chunks.get(key(x,y)); if(!ch||!ch.cv) need.push([x,y,Math.hypot((x+.5)*CW-cam.x,(y+.5)*CW-cam.y)]);}
  need.sort((a,b)=>a[2]-b[2]);
  for(const [x,y] of need.slice(0,budget)){ let ch=chunks.get(key(x,y)); if(!ch){ch=genChunk(x,y); chunks.set(key(x,y),ch)} renderChunk(ch,now); }
  for(const ch of chunks.values()) if(ch.cv&&Math.hypot((ch.cx+.5)*CW-cam.x,(ch.cy+.5)*CW-cam.y)>CW*4+W/z){ch.cv=null;ch.objs=null}
}

// ---------- critters ----------
const okFor={fly:()=>true,sea:h=>h<1.15,walk:h=>h>2.4&&h<4.4};
function spawn(k,z){
  for(let t=0;t<14;t++){ const x=cam.x+(Math.random()-.5)*(W/z+CW*.6), y=cam.y+(Math.random()-.5)*(H_/z+CW*.6), h=hAt(x,y); if(h===null||!okFor[k](h)) continue;
    const a=Math.random()*6.28, sp=k==="fly"?60+Math.random()*50:k==="sea"?14+Math.random()*16:6+Math.random()*10, list=TH[k];
    ents.push({k,x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,e:list[Math.random()*list.length|0],s:k==="fly"?46:k==="sea"?58:42,age:0,turn:1+Math.random()*3,ph:Math.random()*6.28}); return; }
}
function updateEnts(dt,z){
  const cnt={fly:0,sea:0,walk:0}; for(const e of ents) cnt[e.k]++;
  for(const [k,n] of [["fly",14],["sea",14],["walk",22]]) if(cnt[k]<n) spawn(k,z);
  for(let i=ents.length-1;i>=0;i--){ const e=ents[i]; e.age+=dt; e.x+=e.vx*dt; e.y+=e.vy*dt;
    if(Math.hypot(e.x-cam.x,e.y-cam.y)>Math.max(W,H_)/z*1.1+CW){ents.splice(i,1);continue}
    if(e.k!=="fly"){ const h=hAt(e.x,e.y); if(h===null||!okFor[e.k](h)){ e.x-=e.vx*dt*2; e.y-=e.vy*dt*2; const a=Math.random()*6.28,sp=Math.hypot(e.vx,e.vy); e.vx=Math.cos(a)*sp; e.vy=Math.sin(a)*sp; }
      if((e.turn-=dt)<0){ e.turn=2+Math.random()*4; const a=Math.atan2(e.vy,e.vx)+(Math.random()-.5)*2, sp=Math.hypot(e.vx,e.vy); e.vx=Math.cos(a)*sp; e.vy=Math.sin(a)*sp; } }
  }
}

// ---------- frame ----------
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t), NIGHT=[80,95,180], DAY=[255,255,255], DUSK=[255,178,122];
function frame(ts){
  const dt=Math.min(.05,(ts-last)/1000||.016); last=ts; const z=cfg.z, t=ts/1000;
  if(!drag){ if(cfg.auto&&cfg.sp>0){ heading+=(Math.sin(t*.13)+Math.sin(t*.071+1))*.11*dt; vel.x+=(Math.cos(heading)*cfg.sp-vel.x)*dt*1.5; vel.y+=(Math.sin(heading)*cfg.sp-vel.y)*dt*1.5; cam.x+=vel.x*dt; cam.y+=vel.y*dt; }
    else { cam.x+=vel.x*dt; cam.y+=vel.y*dt; vel.x*=.94; vel.y*=.94; } }
  ensureChunks(ts,z,chunks.size<9?3:1);
  if(cfg.cyc){ cfg.tm=(cfg.tm+dt/150)%1; $("tm").value=cfg.tm; $("tmV").textContent=(cfg.tm*24|0)+":00"; }
  updateEnts(dt,z);
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle=TH.pal[0]; ctx.fillRect(0,0,W,H_);
  const base=new DOMMatrix().translate(W/2-cam.x*z,H_/2-cam.y*z);
  pat1.setTransform(base.translate(t*9,t*5).scale(z)); ctx.fillStyle=pat1; ctx.fillRect(0,0,W,H_);
  pat2.setTransform(base.translate(-t*6,t*8).scale(z*1.15)); ctx.fillStyle=pat2; ctx.fillRect(0,0,W,H_);
  ctx.setTransform(dpr*z,0,0,dpr*z,dpr*(W/2-cam.x*z),dpr*(H_/2-cam.y*z));
  const vx0=cam.x-W/2/z-100,vx1=cam.x+W/2/z+100,vy0=cam.y-H_/2/z-100,vy1=cam.y+H_/2/z+160, draw=[];
  for(const ch of chunks.values()){ if(!ch.cv) continue; const x=ch.cx*CW,y=ch.cy*CW; if(x>vx1||x+CW<vx0||y>vy1||y+CW<vy0) continue;
    const a=clamp((ts-ch.born)/1400,0,1), e=1-Math.pow(1-a,3); ctx.globalAlpha=e; const s=.94+.06*e, o=CW*(1-s)/2; ctx.drawImage(ch.cv,x+o,y+o,CW*s+1,CW*s+1);
    if(ch.objs&&a>.3) for(const o2 of ch.objs) if(o2.x>vx0&&o2.x<vx1&&o2.y>vy0&&o2.y<vy1) draw.push(o2); }
  ctx.globalAlpha=1;
  for(const e of ents) if(e.k!=="fly"&&e.x>vx0&&e.x<vx1&&e.y>vy0&&e.y<vy1) draw.push(e);
  draw.sort((a,b)=>a.y-b.y);
  for(const o of draw){ const s=o.s; ctx.save(); ctx.translate(o.x,o.y);
    ctx.fillStyle="rgba(0,0,0,.22)"; ctx.beginPath(); ctx.ellipse(0,0,s*.36,s*.13,0,0,7); ctx.fill();
    if(o.k){ ctx.globalAlpha=clamp(o.age,0,1); const bob=Math.sin(t*(o.k==="sea"?2.2:6)+o.ph)*(o.k==="sea"?3:2.5); if(o.vx>0) ctx.scale(-1,1); ctx.drawImage(spr(o.e),-s*.6,-s*1.05+bob,s*1.2,s*1.2); }
    else { ctx.rotate(Math.sin(t*1.3+o.ph)*.045); ctx.drawImage(spr(o.e),-s*.6,-s*1.08,s*1.2,s*1.2); }
    ctx.restore(); }
  ctx.globalAlpha=1; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cl=clouds.slice(0,Math.round(4*cfg.cl));
  const wrapX=W+700, wrapY=H_+700, sx=(x,par)=>((x*wrapX-cam.x*par*z)%wrapX+wrapX)%wrapX-350, sy=(y,par)=>((y*wrapY-cam.y*par*z)%wrapY+wrapY)%wrapY-350;

      const gr=ctx.createRadialGradient(px,py,0,px,py,14); gr.addColorStop(0,`rgba(255,240,150,${.9*a*tw})`); gr.addColorStop(1,"rgba(255,240,150,0)"); ctx.fillStyle=gr; ctx.fillRect(px-14,py-14,28,28); } }

  const vg=ctx.createRadialGradient(W/2,H_/2,Math.min(W,H_)*.45,W/2,H_/2,Math.max(W,H_)*.8); vg.addColorStop(0,"rgba(0,0,0,0)"); vg.addColorStop(1,"rgba(0,0,0,.35)"); ctx.fillStyle=vg; ctx.fillRect(0,0,W,H_);
  for(let i=pops.length-1;i>=0;i--){ const p=pops[i]; p.life-=dt; if(p.life<=0){pops.splice(i,1);continue} p.vy+=420*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.r+=p.vr*dt;
    ctx.save(); ctx.globalAlpha=clamp(p.life,0,1); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.drawImage(spr(p.e),-p.s/2,-p.s/2,p.s,p.s); ctx.restore(); }
  $("stat").textContent=`${chunks.size} chunks grown · ${GV.size} terrain vertices`;
  requestAnimationFrame(frame);
}
